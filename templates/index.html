<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Password Leak Checker</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-dark text-light">
    <div class="container mt-5" style="max-width: 600px;">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>🔒 Password Leak Checker</h2>
            <a href="/history" class="btn btn-outline-light btn-sm">View History Report</a>
        </div>
        
        <div class="card p-4 bg-secondary text-light shadow">
            <form method="POST">
                <div class="mb-3">
                    <label for="query_value" class="form-label">Enter a password to test security:</label>
                    <input type="password" class="form-control" name="query_value" placeholder="Enter password..." required>
                </div>
                <button type="submit" class="btn btn-primary w-100">Check Security & k-Anonymity</button>
            </form>
        </div>

        {% if result %}
            <div class="alert mt-4 shadow {% if 'Safe' in result %}alert-success{% else %}alert-danger{% endif %}">
                <h4 class="alert-heading">Analysis Result:</h4>
                <p class="mb-1">{{ result }}</p>
                <hr>
                <p class="mb-0"><strong>Password Strength:</strong> {{ strength }}</p>
            </div>
        {% endif %}
    </div>
</body>
</html>
