<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Breach History Report</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-dark text-light">
    <div class="container mt-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>📊 Search History Logs</h2>
            <a href="/" class="btn btn-secondary">Back to Checker</a>
        </div>
        <table class="table table-dark table-striped table-hover shadow">
            <thead>
                <tr>
                    <th>Input</th>
                    <th>Result</th>
                    <th>Strength</th>
                    <th>Timestamp</th>
                </tr>
            </thead>
            <tbody>
                {% for log in logs %}
                <tr>
                    <td>{{ log[0] }}</td>
                    <td>{{ log[1] }}</td>
                    <td><span class="badge {% if log[2] == 'Strong' %}bg-success{% elif log[2] == 'Medium' %}bg-warning text-dark{% else %}bg-danger{% endif %}">{{ log[2] }}</span></td>
                    <td>{{ log[3] }}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</body>
</html>
